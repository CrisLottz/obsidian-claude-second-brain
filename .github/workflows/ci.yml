# Checks on every PR and on main: the scripts compile, every note passes the frontmatter validator.
# On the upstream template repo only, it also scans for secrets and personal data (privacy_scan.py).
# Copies made from the template run the first job too, which is useful for your own notes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit; Dependabot (.github/dependabot.yml) opens a PR when a new version is out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scripts compile
        run: python3 -m py_compile .github/scripts/*.py .claude/hooks/*.py .claude/global/install.py

      - name: Notes pass the frontmatter validator
        run: python3 .claude/hooks/validate_frontmatter.py --all

  privacy:
    if: github.repository == 'CrisLottz/obsidian-claude-second-brain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No secrets or personal data in tracked files
        run: python3 .github/scripts/privacy_scan.py
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}   # maintainer-only list; empty on forks
